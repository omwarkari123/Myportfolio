apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
  namespace: myportfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
      - name: python-app
        image: omwarkri123/myportfolio:python-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: python-service
  namespace: myportfolio
spec:
  type: NodePort
  selector:
    app: python-app
  ports:
  - port: 8080
    targetPort: 8080
